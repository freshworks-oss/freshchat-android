name: Public Repo Release (Post Sign-Off)

# Run this AFTER the internal repo production release workflow has completed.
# It handles: reverse-merge canary → main, create tag, create GitHub Release.
# Use dry_run=true to test without merging into main or publishing a real release.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — creates a draft release only. No merge into main, no tag pushed, canary kept.'
        type: boolean
        default: true
      version_name:
        description: 'Version name to release (e.g. 6.5.5)'
        required: true
      canary_branch:
        description: 'Canary branch name to reverse-merge (e.g. Canary_6.5.5)'
        required: true

jobs:
  public_release:
    name: Public Repo Release
    runs-on: mobile

    env:
      VERSION_NAME: ${{ github.event.inputs.version_name }}
      CANARY_BRANCH: ${{ github.event.inputs.canary_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout public repo (main branch)
      # ─────────────────────────────────────────────
      - name: Checkout public repo (main)
        uses: actions/checkout@v3
        with:
          ref: test_merge
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

      # ─────────────────────────────────────────────
      # 2. Read release notes from top of CHANGELOG.md
      # ─────────────────────────────────────────────
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          RELEASE_NOTES=$(awk '
            /^### [0-9]/ && found { exit }
            /^### [0-9]/ { found=1; print; next }
            found { print }
          ' CHANGELOG.md)

          echo "Release notes:"
          echo "$RELEASE_NOTES"

          EOF_MARKER=$(openssl rand -hex 8)
          echo "content<<${EOF_MARKER}" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES"         >> $GITHUB_OUTPUT
          echo "${EOF_MARKER}"          >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────────
      # 3. Reverse-merge: merge canary branch → main
      #    Skipped during dry-run.
      # ─────────────────────────────────────────────
      - name: Fetch all branches
        run: git fetch origin

      - name: Merge Canary branch into main
        if: ${{ inputs.dry_run != true }}
        run: |
          git merge "origin/$CANARY_BRANCH" \
            --no-ff \
            -m "Merge $CANARY_BRANCH into test_merge for release $VERSION_NAME"
          echo "Canary branch $CANARY_BRANCH merged into test_merge."

      - name: Push main
        if: ${{ inputs.dry_run != true }}
        run: |
          git push origin test_merge
          echo "main pushed."

      # ─────────────────────────────────────────────
      # 4. Create and push version tag
      #    Skipped during dry-run — draft releases on
      #    GitHub don't require the tag to exist yet.
      # ─────────────────────────────────────────────
      - name: Create and push version tag
        if: ${{ inputs.dry_run != true }}
        run: |
          git tag "$VERSION_NAME"
          git push origin "$VERSION_NAME"
          echo "Tag $VERSION_NAME created and pushed."

      - name: Verify tag appears in tag list
        if: ${{ inputs.dry_run != true }}
        run: |
          echo "Latest tags in public repo:"
          git tag --sort=-creatordate | head -5

      # ─────────────────────────────────────────────
      # 5. Create GitHub Release in public repo
      #    Draft when dry_run=true, published otherwise.
      # ─────────────────────────────────────────────
      - name: Create GitHub Release (public repo)
        run: |
          RELEASE_NOTES="${{ steps.notes.outputs.content }}"

          # TODO: revert DRAFT to dynamic after testing
          DRAFT="true"
          echo "Draft mode enabled for testing."

          curl -s \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{
              \"tag_name\": \"${VERSION_NAME}\",
              \"name\": \"Freshchat Android SDK ${VERSION_NAME}\",
              \"body\": $(echo "$RELEASE_NOTES" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))'),
              \"draft\": ${DRAFT},
              \"prerelease\": false
            }"
          echo "GitHub Release $VERSION_NAME created in public repo (draft=$DRAFT)."

      # ─────────────────────────────────────────────
      # 6. Delete the Canary branch after merge.
      #    Skipped during dry-run so it can be reused.
      # ─────────────────────────────────────────────
      - name: Delete Canary branch (cleanup)
        if: ${{ inputs.dry_run != true }}
        run: |
          git push origin --delete "$CANARY_BRANCH" || true
          echo "Canary branch $CANARY_BRANCH deleted (or already gone)."

      - name: Print summary
        run: |
          IS_DRY_RUN="${{ inputs.dry_run }}"
          echo "=============================================="
          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "  DRY RUN complete — draft release created."
            echo "  main was NOT merged. Tag was NOT pushed."
            echo "  Canary branch kept intact for re-testing."
          else
            echo "  Public repo release complete!"
            echo "  Canary branch $CANARY_BRANCH merged + deleted."
          fi
          echo "  Version : $VERSION_NAME"
          echo "  Tag     : $VERSION_NAME"
          echo ""
          echo "  JitPack stable dependency:"
          echo "  implementation 'com.github.freshworks-oss:freshchat-android:$VERSION_NAME'"
          echo "=============================================="
